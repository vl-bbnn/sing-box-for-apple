name: Upload Pinned bbnn iOS Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Preflight only or build and upload iOS
        type: choice
        options: [metadata, signing, ios]
        default: metadata
      bundle_id:
        description: Existing App Store Connect bundle ID
        type: string
        default: pro.bbnn.vpn
      signing_run_id:
        description: Reuse encrypted distribution identity from a previous signing run
        type: string
        default: ''
      version:
        description: App marketing version
        type: string
        default: '1.14.6'
      build_number:
        description: Unique App Store Connect build number
        type: string
        default: '2026100803'

permissions:
  contents: write
  actions: read

concurrency:
  group: bbnn-ios-upload
  cancel-in-progress: false

env:
  OVERLAY_APPLICATION_NAME: bbnn-vpn
  OVERLAY_BASE_PACKAGE_IDENTIFIER: ${{ inputs.bundle_id }}
  OVERLAY_DEVELOPMENT_TEAM: ${{ vars.OVERLAY_DEVELOPMENT_TEAM }}
  VPN_CLIENT_IMPORT_SCHEME: pro.bbnn.vpn
  OVERLAY_APPLICATION_LINK: ${{ vars.OVERLAY_APPLICATION_LINK }}
  OVERLAY_CHANGELOG_LINK: ${{ vars.OVERLAY_CHANGELOG_LINK }}
  OVERLAY_CONFIGURATION_LINK: ${{ vars.OVERLAY_CONFIGURATION_LINK }}
  OVERLAY_SOURCE_LINK: ${{ vars.OVERLAY_SOURCE_LINK }}
  OVERLAY_RELEASES_LINK: ${{ vars.OVERLAY_RELEASES_LINK }}
  SING_BOX_REPO_URL: https://github.com/vl-bbnn/sing-box.git
  SING_BOX_REPO_REF: 3a85db1ddb54c55ced03e7cf92aae68b95b3acaf
  SING_BOX_LX: '1'
  LIBBOX_VARIANT: ordinary
  LIBBOX_APPLE_PLATFORMS: ios
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_KEY_ISSUER_ID: ${{ secrets.ASC_KEY_ISSUER_ID }}
  ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate target and existing API access
        shell: bash
        run: |
          set -euo pipefail
          [[ "$OVERLAY_BASE_PACKAGE_IDENTIFIER" == 'pro.bbnn.vpn' ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          [[ "$RELEASE_BUILD_NUMBER" =~ ^[0-9]+$ ]]
          test -n "$OVERLAY_DEVELOPMENT_TEAM"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_KEY_ISSUER_ID"
          test -n "$ASC_KEY_P8"
          mkdir -p "$RUNNER_TEMP/asc"
          export ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          ruby scripts/app_store_connect.rb verify-app --bundle-id "$OVERLAY_BASE_PACKAGE_IDENTIFIER"

  upload-ios:
    needs: preflight
    if: inputs.platform == 'ios' || inputs.platform == 'signing'
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      BBNN_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.BBNN_DISTRIBUTION_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      CI_BUILD_NUMBER: ${{ inputs.build_number }}
      XCODEBUILD_EXTRA_FLAGS: -skipPackagePluginValidation -skipMacroValidation
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version: '~1.26.8'
          cache: false
      - name: Prepare API key and build configuration
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          test "$(xcodebuild -version | tail -1)" = 'Build version 27A266a'
          command -v xcbeautify >/dev/null || brew install xcbeautify
          command -v swiftlint >/dev/null || brew install swiftlint
          mkdir -p "$RUNNER_TEMP/asc"
          ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"
          ./scripts/install_apple_signing_assets.sh
          ./ci_scripts/ci_pre_xcodebuild.sh
      - name: Restore reusable bbnn distribution identity
        shell: bash
        run: |
          if [[ -n "$BBNN_DISTRIBUTION_CERTIFICATE_BASE64" ]]; then
            mkdir -p build/signing
            printf '%s' "$BBNN_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > build/signing/Distribution.p12
            chmod 600 build/signing/Distribution.p12
          fi
      - name: Restore retained encrypted signing identity
        if: inputs.signing_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: bbnn-encrypted-distribution-identity
          run-id: ${{ inputs.signing_run_id }}
          github-token: ${{ github.token }}
          path: build/signing
      - name: Prepare explicit App Store provisioning
        run: |
          ruby scripts/app_store_connect.rb prepare-signing --bundle-id "$OVERLAY_BASE_PACKAGE_IDENTIFIER" --build-number "$RELEASE_BUILD_NUMBER"
      - name: Confirm reusable distribution identity exists
        run: test -s build/signing/Distribution.p12
      - name: Restore pinned ordinary libbox
        id: libbox-cache
        if: inputs.platform == 'ios'
        uses: actions/cache/restore@v5
        with:
          path: build/libbox/ordinary/Libbox.xcframework
          key: bbnn-libbox-ios-lx-${{ env.SING_BOX_REPO_REF }}-go1.26.8
      - name: Build pinned WLT-free libbox
        if: inputs.platform == 'ios' && steps.libbox-cache.outputs.cache-hit != 'true'
        run: bash scripts/build_libbox.sh 1.14.2
      - name: Save compiled ordinary libbox
        if: inputs.platform == 'ios' && steps.libbox-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: build/libbox/ordinary/Libbox.xcframework
          key: bbnn-libbox-ios-lx-${{ env.SING_BOX_REPO_REF }}-go1.26.8
      - name: Verify ordinary source and variant
        if: inputs.platform == 'ios'
        run: |
          scripts/verify_libbox_variant.sh ordinary build/libbox/ordinary/Libbox.xcframework
          test "$(cat build/libbox/ordinary/Libbox.xcframework/.libbox-source-ref)" = "$SING_BOX_REPO_REF"
          git diff --exit-code
      - name: Verify icon compiler compatibility
        if: inputs.platform == 'ios'
        shell: bash
        run: |
          mkdir -p build/icon-check
          set -o pipefail
          xcrun actool OverlayAppIcon.icon SFI/Assets.xcassets OverlayDevAppIcon.icon \
            --compile build/icon-check --output-format human-readable-text --notices --warnings \
            --output-partial-info-plist build/icon-check/Info.plist --app-icon OverlayAppIcon \
            --accent-color AccentColor --compress-pngs --target-device iphone --target-device ipad \
            --minimum-deployment-target 15.0 --platform iphoneos \
            2>&1 | tee build/icon-check.log
      - name: Archive iOS
        if: inputs.platform == 'ios'
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/configure_ios_signing.py
          xcodebuild archive -scheme SFI -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/SFI.xcarchive -skipPackagePluginValidation -skipMacroValidation \
            APP_SHORTCUTS_ENABLE_FLEXIBLE_MATCHING=NO CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' \
            DEVELOPMENT_TEAM="$OVERLAY_DEVELOPMENT_TEAM" \
            MARKETING_VERSION="$RELEASE_VERSION" CURRENT_PROJECT_VERSION="$RELEASE_BUILD_NUMBER" \
            2>&1 | tee build/archive_ios.log | xcbeautify
      - name: Verify archive identity
        if: inputs.platform == 'ios'
        shell: bash
        run: |
          python3 - <<'PYVERIFY'
          import plistlib
          from pathlib import Path
          import os
          app = Path('build/SFI.xcarchive/Products/Applications/bbnn-vpn.app')
          expected = os.environ['OVERLAY_BASE_PACKAGE_IDENTIFIER']
          info = plistlib.loads((app/'Info.plist').read_bytes())
          assert info['CFBundleIdentifier'] == expected, info['CFBundleIdentifier']
          assert info['CFBundleDisplayName'] == 'bbnn-vpn'
          assert info['CFBundleShortVersionString'] == os.environ['RELEASE_VERSION']
          assert info['CFBundleVersion'] == os.environ['RELEASE_BUILD_NUMBER']
          assert 'pro.bbnn.vpn' in [scheme for item in info['CFBundleURLTypes'] for scheme in item['CFBundleURLSchemes']]
          extensions = list((app/'PlugIns').glob('*.appex')) + list((app/'Extensions').glob('*.appex'))
          seen = {info['CFBundleIdentifier']}
          for extension in extensions:
              p = plistlib.loads((extension/'Info.plist').read_bytes())
              seen.add(p['CFBundleIdentifier'])
              assert p['CFBundleIdentifier'].startswith(expected+'.'), p['CFBundleIdentifier']
              assert p['CFBundleShortVersionString'] == info['CFBundleShortVersionString']
              assert p['CFBundleVersion'] == info['CFBundleVersion']
          assert seen == {expected + suffix for suffix in ('', '.extension', '.fileprovider', '.intents', '.widget', '.share', '.action')}, seen
          print({k: info[k] for k in ('CFBundleIdentifier', 'CFBundleDisplayName', 'CFBundleShortVersionString', 'CFBundleVersion')})
          PYVERIFY
          codesign --verify --deep --strict build/SFI.xcarchive/Products/Applications/bbnn-vpn.app
      - name: Export signed IPA
        if: inputs.platform == 'ios'
        shell: bash
        run: |
          python3 - <<'PYEXPORT'
          import plistlib, os, json
          receipt = json.load(open('build/signing/receipt.json'))
          options = {'method':'app-store-connect', 'destination':'export', 'teamID':os.environ['OVERLAY_DEVELOPMENT_TEAM'],
                     'signingStyle':'manual', 'signingCertificate':receipt['certificate_sha1'],
                     'provisioningProfiles':{p['identifier']:p['name'] for p in receipt['profiles']},
                     'manageAppVersionAndBuildNumber':False}
          with open('build/Export.plist', 'wb') as f: plistlib.dump(options, f)
          PYEXPORT
          set -o pipefail
          PATH=/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin xcodebuild -exportArchive \
            -archivePath build/SFI.xcarchive -exportOptionsPlist build/Export.plist -exportPath build/export \
            2>&1 | tee build/export_ios.log
      - name: Retain signed IPA in a draft release
        if: inputs.platform == 'ios'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="bbnn-build-${GITHUB_RUN_ID}"
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "bbnn-vpn iOS $RELEASE_VERSION ($RELEASE_BUILD_NUMBER)" --notes 'Signed App Store Connect build and evidence.'
          gh release upload "$tag" build/export/*.ipa
      - name: Upload to App Store Connect
        if: inputs.platform == 'ios'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/asc/private_keys"
          cp "$ASC_KEY_PATH" "$RUNNER_TEMP/asc/private_keys/"
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/asc/private_keys"
          ipa_path=$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$ipa_path"
          set -o pipefail
          xcrun altool --upload-app --type ios --file "$ipa_path" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_KEY_ISSUER_ID" \
            2>&1 | tee build/upload_ios.log
      - name: Verify exact processed build
        if: inputs.platform == 'ios'
        run: |
          ruby scripts/app_store_connect.rb verify-build \
            --bundle-id "$OVERLAY_BASE_PACKAGE_IDENTIFIER" --platform ios \
            --version "$RELEASE_VERSION" --build-number "$RELEASE_BUILD_NUMBER" --timeout 1800 \
            | tee build/app-store-connect-receipt.json
      - name: Retain release evidence in the draft
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="bbnn-build-${GITHUB_RUN_ID}"
          gh release view "$tag" >/dev/null || gh release create "$tag" --draft --target "$GITHUB_SHA" --title "bbnn-vpn iOS build $GITHUB_RUN_ID" --notes 'Build evidence.'
          mkdir -p build/evidence
          cp sing-box.xcodeproj/project.pbxproj build/evidence/
          test ! -f build/signing/receipt.json || cp build/signing/receipt.json build/evidence/signing-receipt.json
          test ! -f build/SFI.xcarchive/Info.plist || cp build/SFI.xcarchive/Info.plist build/evidence/archive-Info.plist
          find build/libbox -name '.libbox-*' -exec cp {} build/evidence/ \; 2>/dev/null || true
          find build -maxdepth 1 -type f \( -name '*.log' -o -name '*receipt.json' \) -exec cp {} build/evidence/ \;
          tar -czf build/evidence.tar.gz -C build/evidence .
          gh release upload "$tag" build/evidence.tar.gz --clobber
