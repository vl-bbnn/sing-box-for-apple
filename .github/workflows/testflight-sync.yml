name: Sync And Upload TestFlight

on:
  workflow_dispatch:
    inputs:
      force_release:
        description: Force a build and upload even if upstream version did not change
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

concurrency:
  group: testflight-sync
  cancel-in-progress: false

jobs:
  sync-build-upload:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      OVERLAY_BASE_PACKAGE_IDENTIFIER: ${{ vars.OVERLAY_BASE_PACKAGE_IDENTIFIER }}
      OVERLAY_DEVELOPMENT_TEAM: ${{ vars.OVERLAY_DEVELOPMENT_TEAM }}
      OVERLAY_MACOS_SYSTEM_PROFILE_SPECIFIER: ${{ vars.OVERLAY_MACOS_SYSTEM_PROFILE_SPECIFIER }}
      OVERLAY_MACOS_STANDALONE_PROFILE_SPECIFIER: ${{ vars.OVERLAY_MACOS_STANDALONE_PROFILE_SPECIFIER }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_KEY_ISSUER_ID: ${{ secrets.ASC_KEY_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_BETA_GROUP_ID: ${{ secrets.ASC_BETA_GROUP_ID }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_PROVISIONING_PROFILES_ARCHIVE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILES_ARCHIVE_BASE64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build tools
        run: |
          if ! command -v xcbeautify >/dev/null 2>&1; then
            brew install xcbeautify
          fi

      - name: Configure remotes
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/SagerNet/sing-box-for-apple.git
          else
            git remote add upstream https://github.com/SagerNet/sing-box-for-apple.git
          fi

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

      - name: Validate workflow configuration
        run: |
          test -n "$OVERLAY_BASE_PACKAGE_IDENTIFIER"
          test -n "$OVERLAY_DEVELOPMENT_TEAM"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_KEY_ISSUER_ID"
          test -n "$ASC_KEY_P8"

      - name: Prepare release branch
        id: prepare
        run: |
          if [[ "${{ github.event.inputs.force_release || 'false' }}" == "true" ]]; then
            ./scripts/prepare_overlay_release.sh --force
          else
            ./scripts/prepare_overlay_release.sh
          fi

      - name: Stop when upstream version is unchanged
        if: steps.prepare.outputs.should_release != 'true'
        run: |
          echo "No upstream version bump detected."

      - name: Render overlay config
        if: steps.prepare.outputs.should_release == 'true'
        run: ./ci_scripts/ci_pre_xcodebuild.sh

      - name: Sync submodules for release branch
        if: steps.prepare.outputs.should_release == 'true'
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install signing assets
        if: steps.prepare.outputs.should_release == 'true'
        run: ./scripts/install_apple_signing_assets.sh

      - name: Archive and upload iOS
        if: steps.prepare.outputs.should_release == 'true'
        run: |
          make archive_ios
          make upload_ios

      - name: Publish iOS build to TestFlight
        if: steps.prepare.outputs.should_release == 'true' && env.ASC_BETA_GROUP_ID != ''
        run: |
          ruby scripts/app_store_connect.rb publish-testflight \
            --bundle-id "$OVERLAY_BASE_PACKAGE_IDENTIFIER" \
            --platform ios \
            --version "${{ steps.prepare.outputs.new_version }}" \
            --beta-group-id "$ASC_BETA_GROUP_ID" \
            --whats-new "sing-box ${{ steps.prepare.outputs.new_version }}"

      - name: Archive and upload macOS
        if: steps.prepare.outputs.should_release == 'true'
        run: |
          make archive_macos
          make upload_macos

      - name: Publish macOS build to TestFlight
        if: steps.prepare.outputs.should_release == 'true' && env.ASC_BETA_GROUP_ID != ''
        run: |
          ruby scripts/app_store_connect.rb publish-testflight \
            --bundle-id "$OVERLAY_BASE_PACKAGE_IDENTIFIER" \
            --platform macos \
            --version "${{ steps.prepare.outputs.new_version }}" \
            --beta-group-id "$ASC_BETA_GROUP_ID" \
            --whats-new "sing-box ${{ steps.prepare.outputs.new_version }}"

      - name: Push synced branches
        if: steps.prepare.outputs.should_release == 'true' && steps.prepare.outputs.should_push == 'true'
        run: |
          git push origin "${{ steps.prepare.outputs.upstream_sha }}:refs/heads/main"
          git push --force-with-lease origin HEAD:refs/heads/overlay
