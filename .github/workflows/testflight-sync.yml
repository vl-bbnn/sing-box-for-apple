name: Sync And Upload TestFlight

on:
  workflow_dispatch:
    inputs:
      force_release:
        description: Force a build and upload even if upstream version did not change
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: testflight-sync
  cancel-in-progress: false

env:
  LIBBOX_APPLE_PLATFORMS: ios,macos
  LIBBOX_APPLE_PLATFORMS_CACHE_KEY: ios-macos

jobs:
  detect-release:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.prepare.outputs.should_release }}
      should_push: ${{ steps.prepare.outputs.should_push }}
      upstream_sha: ${{ steps.prepare.outputs.upstream_sha }}
      new_version: ${{ steps.prepare.outputs.new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure remotes
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/SagerNet/sing-box-for-apple.git
          else
            git remote add upstream https://github.com/SagerNet/sing-box-for-apple.git
          fi

      - name: Detect upstream version bump
        id: prepare
        run: |
          if [[ "${{ github.event.inputs.force_release || 'false' }}" == "true" ]]; then
            ./scripts/prepare_overlay_release.sh --force
          else
            ./scripts/prepare_overlay_release.sh
          fi

      - name: Stop when upstream version is unchanged
        if: steps.prepare.outputs.should_release != 'true'
        run: echo "No upstream version bump detected."

  prepare-release:
    needs: detect-release
    if: needs.detect-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      ios_build_exists: ${{ steps.check-ios-build.outputs.exists }}
      macos_build_exists: ${{ steps.check-macos-build.outputs.exists }}
    env:
      OVERLAY_BASE_PACKAGE_IDENTIFIER: ${{ vars.OVERLAY_BASE_PACKAGE_IDENTIFIER }}
      OVERLAY_DEVELOPMENT_TEAM: ${{ vars.OVERLAY_DEVELOPMENT_TEAM }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_KEY_ISSUER_ID: ${{ secrets.ASC_KEY_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure remotes
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/SagerNet/sing-box-for-apple.git
          else
            git remote add upstream https://github.com/SagerNet/sing-box-for-apple.git
          fi

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

      - name: Validate workflow configuration
        run: |
          test -n "$OVERLAY_BASE_PACKAGE_IDENTIFIER"
          test -n "$OVERLAY_DEVELOPMENT_TEAM"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_KEY_ISSUER_ID"
          test -n "$ASC_KEY_P8"

      - name: Prepare release branch
        run: |
          if [[ "${{ github.event.inputs.force_release || 'false' }}" == "true" ]]; then
            ./scripts/prepare_overlay_release.sh --force
          else
            ./scripts/prepare_overlay_release.sh
          fi

      - name: Check existing iOS build
        id: check-ios-build
        run: |
          if ruby scripts/app_store_connect.rb build-exists \
            --bundle-id "$OVERLAY_BASE_PACKAGE_IDENTIFIER" \
            --platform ios \
            --version "${{ needs.detect-release.outputs.new_version }}" > /tmp/ios-build.log 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            cat /tmp/ios-build.log
          else
            status=$?
            cat /tmp/ios-build.log
            if [[ "$status" == "3" ]]; then
              echo "exists=false" >> "$GITHUB_OUTPUT"
            else
              exit "$status"
            fi
          fi

      - name: Check existing macOS build
        id: check-macos-build
        run: |
          if ruby scripts/app_store_connect.rb build-exists \
            --bundle-id "$OVERLAY_BASE_PACKAGE_IDENTIFIER" \
            --platform macos \
            --version "${{ needs.detect-release.outputs.new_version }}" > /tmp/macos-build.log 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            cat /tmp/macos-build.log
          else
            status=$?
            cat /tmp/macos-build.log
            if [[ "$status" == "3" ]]; then
              echo "exists=false" >> "$GITHUB_OUTPUT"
            else
              exit "$status"
            fi
          fi

  upload-ios:
    needs: [detect-release, prepare-release]
    if: needs.detect-release.outputs.should_release == 'true' && needs.prepare-release.outputs.ios_build_exists != 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      ENABLE_LOCAL_SIGNING_ASSETS: ${{ vars.ENABLE_LOCAL_SIGNING_ASSETS }}
      OVERLAY_BASE_PACKAGE_IDENTIFIER: ${{ vars.OVERLAY_BASE_PACKAGE_IDENTIFIER }}
      OVERLAY_DEVELOPMENT_TEAM: ${{ vars.OVERLAY_DEVELOPMENT_TEAM }}
      OVERLAY_MACOS_SYSTEM_PROFILE_SPECIFIER: ${{ vars.OVERLAY_MACOS_SYSTEM_PROFILE_SPECIFIER }}
      OVERLAY_MACOS_STANDALONE_PROFILE_SPECIFIER: ${{ vars.OVERLAY_MACOS_STANDALONE_PROFILE_SPECIFIER }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_KEY_ISSUER_ID: ${{ secrets.ASC_KEY_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_PROVISIONING_PROFILES_ARCHIVE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILES_ARCHIVE_BASE64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ~1.25.9
          cache: false

      - name: Install build tools
        run: |
          xcodebuild -version
          if ! command -v xcbeautify >/dev/null 2>&1; then
            brew install xcbeautify
          fi

      - name: Configure remotes
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/SagerNet/sing-box-for-apple.git
          else
            git remote add upstream https://github.com/SagerNet/sing-box-for-apple.git
          fi

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

      - name: Validate workflow configuration
        run: |
          test -n "$OVERLAY_BASE_PACKAGE_IDENTIFIER"
          test -n "$OVERLAY_DEVELOPMENT_TEAM"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_KEY_ISSUER_ID"
          test -n "$ASC_KEY_P8"

      - name: Prepare release branch
        run: |
          if [[ "${{ github.event.inputs.force_release || 'false' }}" == "true" ]]; then
            ./scripts/prepare_overlay_release.sh --force
          else
            ./scripts/prepare_overlay_release.sh
          fi

      - name: Render overlay config
        run: ./ci_scripts/ci_pre_xcodebuild.sh

      - name: Sync submodules for release branch
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Restore Go libbox cache
        id: cache-go-libbox
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
            ~/Library/Caches/gomobile
          key: ${{ runner.os }}-go-libbox-${{ needs.detect-release.outputs.new_version }}
          restore-keys: |
            ${{ runner.os }}-go-libbox-

      - name: Restore Libbox.xcframework cache
        id: cache-libbox-xcframework
        uses: actions/cache/restore@v5
        with:
          path: Libbox.xcframework
          key: ${{ runner.os }}-libbox-xcframework-${{ env.LIBBOX_APPLE_PLATFORMS_CACHE_KEY }}-${{ needs.detect-release.outputs.new_version }}

      - name: Build Libbox.xcframework
        if: steps.cache-libbox-xcframework.outputs.cache-hit != 'true'
        run: bash ./scripts/build_libbox.sh "${{ needs.detect-release.outputs.new_version }}" "$GITHUB_WORKSPACE/Libbox.xcframework"

      - name: Save Go libbox cache
        if: steps.cache-go-libbox.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
            ~/Library/Caches/gomobile
          key: ${{ steps.cache-go-libbox.outputs.cache-primary-key }}

      - name: Save Libbox.xcframework cache
        if: steps.cache-libbox-xcframework.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: Libbox.xcframework
          key: ${{ steps.cache-libbox-xcframework.outputs.cache-primary-key }}

      - name: Install signing assets
        if: env.ENABLE_LOCAL_SIGNING_ASSETS == 'true'
        run: ./scripts/install_apple_signing_assets.sh

      - name: Archive iOS
        run: make archive_ios

      - name: Upload iOS
        run: make upload_ios

  publish-ios-group:
    needs: [detect-release, prepare-release, upload-ios]
    if: needs.detect-release.outputs.should_release == 'true' && (needs.prepare-release.outputs.ios_build_exists == 'true' || needs.upload-ios.result == 'success')
    runs-on: ubuntu-latest
    env:
      OVERLAY_BASE_PACKAGE_IDENTIFIER: ${{ vars.OVERLAY_BASE_PACKAGE_IDENTIFIER }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_KEY_ISSUER_ID: ${{ secrets.ASC_KEY_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_BETA_GROUP_ID: ${{ secrets.ASC_BETA_GROUP_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Write App Store Connect API key
        if: env.ASC_BETA_GROUP_ID != ''
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

      - name: Publish iOS build to TestFlight group
        if: env.ASC_BETA_GROUP_ID != ''
        continue-on-error: true
        run: |
          ruby scripts/app_store_connect.rb publish-testflight \
            --bundle-id "$OVERLAY_BASE_PACKAGE_IDENTIFIER" \
            --platform ios \
            --version "${{ needs.detect-release.outputs.new_version }}" \
            --beta-group-id "$ASC_BETA_GROUP_ID" \
            --whats-new "sing-box ${{ needs.detect-release.outputs.new_version }}"

  upload-macos:
    needs: [detect-release, prepare-release]
    if: needs.detect-release.outputs.should_release == 'true' && needs.prepare-release.outputs.macos_build_exists != 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      ENABLE_LOCAL_SIGNING_ASSETS: ${{ vars.ENABLE_LOCAL_SIGNING_ASSETS }}
      OVERLAY_BASE_PACKAGE_IDENTIFIER: ${{ vars.OVERLAY_BASE_PACKAGE_IDENTIFIER }}
      OVERLAY_DEVELOPMENT_TEAM: ${{ vars.OVERLAY_DEVELOPMENT_TEAM }}
      OVERLAY_MACOS_SYSTEM_PROFILE_SPECIFIER: ${{ vars.OVERLAY_MACOS_SYSTEM_PROFILE_SPECIFIER }}
      OVERLAY_MACOS_STANDALONE_PROFILE_SPECIFIER: ${{ vars.OVERLAY_MACOS_STANDALONE_PROFILE_SPECIFIER }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_KEY_ISSUER_ID: ${{ secrets.ASC_KEY_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_PROVISIONING_PROFILES_ARCHIVE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILES_ARCHIVE_BASE64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ~1.25.9
          cache: false

      - name: Install build tools
        run: |
          xcodebuild -version
          if ! command -v xcbeautify >/dev/null 2>&1; then
            brew install xcbeautify
          fi

      - name: Configure remotes
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/SagerNet/sing-box-for-apple.git
          else
            git remote add upstream https://github.com/SagerNet/sing-box-for-apple.git
          fi

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

      - name: Validate workflow configuration
        run: |
          test -n "$OVERLAY_BASE_PACKAGE_IDENTIFIER"
          test -n "$OVERLAY_DEVELOPMENT_TEAM"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_KEY_ISSUER_ID"
          test -n "$ASC_KEY_P8"

      - name: Prepare release branch
        run: |
          if [[ "${{ github.event.inputs.force_release || 'false' }}" == "true" ]]; then
            ./scripts/prepare_overlay_release.sh --force
          else
            ./scripts/prepare_overlay_release.sh
          fi

      - name: Render overlay config
        run: ./ci_scripts/ci_pre_xcodebuild.sh

      - name: Sync submodules for release branch
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Restore Go libbox cache
        id: cache-go-libbox
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
            ~/Library/Caches/gomobile
          key: ${{ runner.os }}-go-libbox-${{ needs.detect-release.outputs.new_version }}
          restore-keys: |
            ${{ runner.os }}-go-libbox-

      - name: Restore Libbox.xcframework cache
        id: cache-libbox-xcframework
        uses: actions/cache/restore@v5
        with:
          path: Libbox.xcframework
          key: ${{ runner.os }}-libbox-xcframework-${{ env.LIBBOX_APPLE_PLATFORMS_CACHE_KEY }}-${{ needs.detect-release.outputs.new_version }}

      - name: Build Libbox.xcframework
        if: steps.cache-libbox-xcframework.outputs.cache-hit != 'true'
        run: bash ./scripts/build_libbox.sh "${{ needs.detect-release.outputs.new_version }}" "$GITHUB_WORKSPACE/Libbox.xcframework"

      - name: Save Go libbox cache
        if: steps.cache-go-libbox.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
            ~/Library/Caches/gomobile
          key: ${{ steps.cache-go-libbox.outputs.cache-primary-key }}

      - name: Save Libbox.xcframework cache
        if: steps.cache-libbox-xcframework.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: Libbox.xcframework
          key: ${{ steps.cache-libbox-xcframework.outputs.cache-primary-key }}

      - name: Install signing assets
        if: env.ENABLE_LOCAL_SIGNING_ASSETS == 'true'
        run: ./scripts/install_apple_signing_assets.sh

      - name: Archive macOS
        run: make archive_macos

      - name: Upload macOS
        run: make upload_macos

  publish-macos-group:
    needs: [detect-release, prepare-release, upload-macos]
    if: needs.detect-release.outputs.should_release == 'true' && (needs.prepare-release.outputs.macos_build_exists == 'true' || needs.upload-macos.result == 'success')
    runs-on: ubuntu-latest
    env:
      OVERLAY_BASE_PACKAGE_IDENTIFIER: ${{ vars.OVERLAY_BASE_PACKAGE_IDENTIFIER }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_KEY_ISSUER_ID: ${{ secrets.ASC_KEY_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_BETA_GROUP_ID: ${{ secrets.ASC_BETA_GROUP_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Write App Store Connect API key
        if: env.ASC_BETA_GROUP_ID != ''
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

      - name: Publish macOS build to TestFlight group
        if: env.ASC_BETA_GROUP_ID != ''
        continue-on-error: true
        run: |
          ruby scripts/app_store_connect.rb publish-testflight \
            --bundle-id "$OVERLAY_BASE_PACKAGE_IDENTIFIER" \
            --platform macos \
            --version "${{ needs.detect-release.outputs.new_version }}" \
            --beta-group-id "$ASC_BETA_GROUP_ID" \
            --whats-new "sing-box ${{ needs.detect-release.outputs.new_version }}"

  finalize-release:
    needs: [detect-release, prepare-release, upload-ios, upload-macos]
    if: needs.detect-release.outputs.should_push == 'true' && needs.upload-ios.result != 'failure' && needs.upload-macos.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure remotes
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/SagerNet/sing-box-for-apple.git
          else
            git remote add upstream https://github.com/SagerNet/sing-box-for-apple.git
          fi

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare release branch
        run: |
          if [[ "${{ github.event.inputs.force_release || 'false' }}" == "true" ]]; then
            ./scripts/prepare_overlay_release.sh --force
          else
            ./scripts/prepare_overlay_release.sh
          fi

      - name: Push synced branches
        run: |
          git push origin "${{ needs.detect-release.outputs.upstream_sha }}:refs/heads/main"
          git push --force-with-lease origin HEAD:refs/heads/overlay
